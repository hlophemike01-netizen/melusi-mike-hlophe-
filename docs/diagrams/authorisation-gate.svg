<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" width="1180" height="700" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">can_view_activity_location as a decision chain</title>
  <desc id="d">The owner is allowed immediately. A suspended account, a block in either direction, and a finished activity each deny. Visibility then decides: private and nearby deny, group requires approved membership, trusted contacts requires a live unrevoked share. No branch reaches allow for an administrator.</desc>

  <rect width="1180" height="700" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#24221f"/>
    </marker>
    <marker id="deny" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c2352b"/>
    </marker>
  </defs>

  <text x="40" y="48" font-size="24" font-weight="700" fill="#24221f">One gate for every precise read</text>
  <text x="40" y="76" font-size="14" fill="#666159">Both the RLS policy and latest_activity_location() go through this predicate. If a rule is not expressed here, it does not exist.</text>

  <g transform="translate(40, 96)">
    <rect x="20" y="14" width="250" height="46" rx="9" fill="#f7f7f6" stroke="#24221f" stroke-width="1.6"/>
    <text x="145" y="43" text-anchor="middle" font-size="14.5" font-weight="700" fill="#24221f">A viewer asks for a position</text>

    <g font-size="13.5" fill="#24221f">
      <rect x="20" y="86" width="250" height="40" rx="8" fill="none" stroke="#24221f" stroke-width="1.4"/>
      <text x="145" y="111" text-anchor="middle" font-weight="600">1 · Are you the owner?</text>
      <rect x="20" y="150" width="250" height="40" rx="8" fill="none" stroke="#24221f" stroke-width="1.4"/>
      <text x="145" y="175" text-anchor="middle" font-weight="600">2 · Is your account active?</text>
      <rect x="20" y="214" width="250" height="40" rx="8" fill="none" stroke="#24221f" stroke-width="1.4"/>
      <text x="145" y="239" text-anchor="middle" font-weight="600">3 · Any block either way?</text>
      <rect x="20" y="278" width="250" height="40" rx="8" fill="none" stroke="#24221f" stroke-width="1.4"/>
      <text x="145" y="303" text-anchor="middle" font-weight="600">4 · Is the activity still live?</text>
      <rect x="20" y="342" width="250" height="40" rx="8" fill="#f7f7f6" stroke="#24221f" stroke-width="1.6"/>
      <text x="145" y="367" text-anchor="middle" font-weight="700">5 · What is its visibility?</text>
    </g>

    <g stroke="#24221f" stroke-width="1.5" marker-end="url(#arrow)" fill="none">
      <line x1="145" y1="62" x2="145" y2="82"/>
      <line x1="145" y1="128" x2="145" y2="146"/>
      <line x1="145" y1="192" x2="145" y2="210"/>
      <line x1="145" y1="256" x2="145" y2="274"/>
      <line x1="145" y1="320" x2="145" y2="338"/>
    </g>

    <path d="M272 106 L390 106 L390 60" stroke="#237a48" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
    <text x="282" y="98" font-size="12" font-weight="700" fill="#237a48">yes</text>

    <g stroke="#c2352b" stroke-width="1.6" fill="none" marker-end="url(#deny)">
      <path d="M272 170 L520 170"/>
      <path d="M272 234 L520 234"/>
      <path d="M272 298 L520 298"/>
    </g>
    <text x="282" y="162" font-size="12" font-weight="700" fill="#c2352b">no</text>
    <text x="282" y="226" font-size="12" font-weight="700" fill="#c2352b">yes</text>
    <text x="282" y="290" font-size="12" font-weight="700" fill="#c2352b">no</text>

    <rect x="336" y="20" width="200" height="40" rx="8" fill="#eaf7ef" stroke="#237a48" stroke-width="2"/>
    <text x="436" y="45" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1a5c37">ALLOW</text>

    <g>
      <rect x="530" y="152" width="150" height="36" rx="8" fill="#fdeceb" stroke="#c2352b" stroke-width="1.8"/>
      <text x="605" y="175" text-anchor="middle" font-size="13.5" font-weight="700" fill="#a12a22">DENY</text>
      <rect x="530" y="216" width="150" height="36" rx="8" fill="#fdeceb" stroke="#c2352b" stroke-width="1.8"/>
      <text x="605" y="239" text-anchor="middle" font-size="13.5" font-weight="700" fill="#a12a22">DENY</text>
      <rect x="530" y="280" width="150" height="36" rx="8" fill="#fdeceb" stroke="#c2352b" stroke-width="1.8"/>
      <text x="605" y="303" text-anchor="middle" font-size="13.5" font-weight="700" fill="#a12a22">DENY</text>
    </g>

    <text x="696" y="175" font-size="12.5" fill="#666159">a suspended viewer gets nothing</text>
    <text x="696" y="239" font-size="12.5" fill="#666159">blocking cuts access on the next read</text>
    <text x="696" y="298" font-size="12.5" fill="#666159">a finished activity is never viewable —</text>
    <text x="696" y="316" font-size="12.5" fill="#666159">not even by the group</text>

    <g font-size="13">
      <rect x="336" y="342" width="190" height="38" rx="8" fill="#fdeceb" stroke="#c2352b" stroke-width="1.5"/>
      <text x="352" y="366" font-weight="700" fill="#a12a22">private</text>
      <text x="516" y="366" text-anchor="end" fill="#a12a22">deny</text>
      <rect x="336" y="388" width="190" height="38" rx="8" fill="#fdeceb" stroke="#c2352b" stroke-width="1.5"/>
      <text x="352" y="412" font-weight="700" fill="#a12a22">nearby</text>
      <text x="516" y="412" text-anchor="end" fill="#a12a22">deny</text>
      <rect x="336" y="434" width="190" height="38" rx="8" fill="#eaf7ef" stroke="#237a48" stroke-width="1.5"/>
      <text x="352" y="458" font-weight="700" fill="#1a5c37">group</text>
      <text x="516" y="458" text-anchor="end" fill="#1a5c37">allow*</text>
      <rect x="336" y="480" width="190" height="38" rx="8" fill="#eaf7ef" stroke="#237a48" stroke-width="1.5"/>
      <text x="352" y="504" font-weight="700" fill="#1a5c37">trusted</text>
      <text x="516" y="504" text-anchor="end" fill="#1a5c37">allow*</text>
    </g>

    <line x1="272" y1="361" x2="330" y2="361" stroke="#24221f" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

    <text x="546" y="412" font-size="12.5" fill="#666159">a count is not a coordinate</text>
    <text x="546" y="458" font-size="12.5" fill="#666159">* only an <tspan font-weight="700">approved</tspan> member of that group</text>
    <text x="546" y="504" font-size="12.5" fill="#666159">* only a live, unrevoked, unexpired share</text>

    <rect x="20" y="498" width="250" height="74" rx="10" fill="#fdeceb" stroke="#c2352b" stroke-width="2"/>
    <text x="145" y="522" text-anchor="middle" font-size="14" font-weight="700" fill="#a12a22">No admin branch exists</text>
    <text x="145" y="542" text-anchor="middle" font-size="12" fill="#3d3a36">is_admin appears nowhere</text>
    <text x="145" y="558" text-anchor="middle" font-size="12" fill="#3d3a36">in this function</text>
  </g>
</svg>
